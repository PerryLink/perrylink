name: gitee-sync

# One-way mirror of the Per
ryLink plugin repos to Gitee. Gitee is a
# re
ad-only copy: GitHub is the source of truth a
nd is never force-pushed.
# Mirror branches/t
ags are aligned to the GitHub tip with
# --fo
rce-with-lease (lease = the mirror's current 
ref, read right before
# the push), so a dive
rged mirror cannot block the sync and a concu
rrent
# mirror update fails loudly instead of
 overwriting.
on:
  schedule:
    - cron: '30
 0 * * *' # daily 08:30 UTC+8
  workflow_disp
atch: {}

permissions: {}

jobs:
  sync:
    
runs-on: ubuntu-latest
    steps:
      - nam
e: Checkout profile repo
        uses: action
s/checkout@v4
        with:
          fetch-d
epth: 0

      - name: Configure SSH for Gite
e
        env:
          GITEE_SSH_KEY: ${{ s
ecrets.GITEE_SSH_KEY }}
        run: |
      
    set -euo pipefail
          mkdir -p ~/.s
sh
          printf '%s\n' "$GITEE_SSH_KEY" >
 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh
/id_ed25519
          ssh-keyscan gitee.com >
> ~/.ssh/known_hosts

      - name: Mirror pr
ofile repo
        run: |
          set -euo 
pipefail
          git remote add gitee git@g
itee.com:perrylink/perrylink.git || true
    
      tip="$(git ls-remote gitee refs/heads/m
ain | awk '{print $1}')"
          if [ -z "$
tip" ]; then
            git push gitee HEAD:
main --tags
          else
            git pu
sh --force-with-lease="refs/heads/main:$tip" 
gitee HEAD:main \
              && git push g
itee --tags --force
          fi

      - nam
e: Mirror plugin repos
        shell: bash
  
      run: |
          set -euo pipefail
    
      repos=(dsh-auto-review dsh-background-a
gents dsh-budget dsh-checkpoint-rewind \
    
        dsh-claude-move dsh-click dsh-compose
r-history dsh-data-quality dsh-defend \
     
       dsh-doublecheck dsh-draw dsh-fast dsh-
fund-research dsh-github \
            dsh-in
dustry-research dsh-library dsh-local-ai dsh-
lsp-actions dsh-mask \
            dsh-mcp-pa
nel dsh-memento dsh-observe dsh-output-styles
 dsh-permission-rules \
            dsh-perso
nal-directive dsh-plugin-guide dsh-plugin-kit
 dsh-research-report \
            dsh-score 
dsh-session-pin dsh-session-sync dsh-skill-pa
ck-security dsh-talk \
            dsh-test-d
rive dsh-translate dsh-reach dsh-catalog dsh-
cert-mcp dsh-ticktick \
            dsh-wecha
t dsh-autotier dsh-plugin-doctor)
          sync_repo() {

            local r="$1"
            rm -rf "
/tmp/$r"
            local remote="git@gitee.
com:perrylink/$r.git"
            # A mirror 
repo that does not exist yet on Gitee is skip
ped, not a
            # failure: once the re
po is created on gitee.com, the next run
    
        # seeds it via the plain-push path be
low.
            if ! git ls-remote "$remote"
 HEAD >/dev/null 2>&1; then
              ech
o "SKIP $r (no mirror repo on gitee)"
       
       return 0
            fi
            if
 ! git clone --quiet "https://github.com/Perr
yLink/$r.git" "/tmp/$r"; then
              e
cho "FAIL clone $r"
              return 1
  
          fi
            local b tip
        
    b="$(git -C "/tmp/$r" rev-parse --abbrev-
ref HEAD)"
            tip="$(git ls-remote "
$remote" "refs/heads/$b" | awk '{print $1}')"

            if [ -z "$tip" ]; then
         
     # Mirror branch does not exist yet: plai
n push seeds it.
              git -C "/tmp/$
r" push "$remote" "HEAD:refs/heads/$b" --tags

            else
              # Align the m
irror branch to the GitHub tip, then refresh 
tags
              # (tags may have moved aft
er a release re-tag).
              git -C "/
tmp/$r" push --force-with-lease="refs/heads/$
b:$tip" "$remote" "HEAD:refs/heads/$b" \
    
            && git -C "/tmp/$r" push "$remote
" --tags --force
            fi
          }
 
         fails=0
          for r in "${repos[
@]}"; do
            if sync_repo "$r"; then

              echo "OK $r"
            else
 
             echo "FAIL $r"
              fai
ls=$((fails + 1))
            fi
          do
ne
          if [ "$fails" -gt 0 ]; then
    
        echo "MIRROR SYNC FAILURES: $fails of
 ${#repos[@]}"
            exit 1
          f
i
          echo "all ${#repos[@]} mirrors ha
ndled"


