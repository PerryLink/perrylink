name: gitee-sync

# One-way mirror of the PerryLink plugin repos to Gitee. Gitee is a
# read-only copy: GitHub is the source of truth and is never force-pushed.
# Mirror branches/tags are aligned to the GitHub tip with
# --force-with-lease (lease = the mirror's current ref, read right before
# the push), so a diverged mirror cannot block the sync and a concurrent
# mirror update fails loudly instead of overwriting.
on:
  schedule:
    - cron: '30 0 * * *' # daily 08:30 UTC+8
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH for Gitee
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      - name: Mirror profile repo
        run: |
          set -euo pipefail
          git remote add gitee git@gitee.com:perrylink/perrylink.git || true
          tip="$(git ls-remote gitee refs/heads/main | awk '{print $1}')"
          if [ -z "$tip" ]; then
            git push gitee HEAD:main --tags
          else
            git push --force-with-lease="refs/heads/main:$tip" gitee HEAD:main \
              && git push gitee --tags --force
          fi

      - name: Mirror plugin repos
        shell: bash
        run: |
          set -euo pipefail
          # Entries are either a bare repo name (owned by PerryLink) or an
          # owner-qualified "owner/name" for a family repo that now lives under
          # another account; the Gitee mirror is always named after the repo.
          # The upgrade corridor is merged into dsh-plugin-upgrade: its retired
          # legs (-015, -rc1, -016) are deliberately not synced any more.
          repos=(
            dsh-ap-three-way dsh-aqua-input-check dsh-ar-aging dsh-ar-collection dsh-archive-check \
            dsh-attendance-check dsh-attention-index dsh-auto-review dsh-autotier dsh-bankrec \
            dsh-bid-ca-precheck dsh-bid-health-check dsh-bid-qual-check dsh-budget \
            dsh-canteen-retention-check dsh-cert-mcp dsh-certification dsh-check-action \
            dsh-check-pack dsh-checkpoint-rewind dsh-cite-verify dsh-claim-check dsh-claude-move \
            dsh-click dsh-clinic dsh-codemod dsh-community-bench dsh-composer-history \
            dsh-construction-doc-check dsh-contract-renewal dsh-contract-stance dsh-contract-suite \
            dsh-customs-doc-check dsh-customs-mcp dsh-data-quality dsh-dataset-card dsh-defend \
            dsh-demurrage-ledger dsh-dida dsh-dmp dsh-doc-anchor dsh-docx-redline dsh-doublecheck \
            dsh-draw dsh-drill-script-check dsh-eia-guide-check dsh-einvoice dsh-emergency-plan \
            dsh-essay-rubric-check dsh-eval-pack dsh-evidence-check dsh-excel-reconcile \
            dsh-export-ctl-check dsh-family-catalog dsh-fast dsh-finops-suite dsh-fmea-table-check \
            dsh-forecast-penalty dsh-freight-audit dsh-fund-research dsh-ghg dsh-github-bot \
            dsh-gongwen-flow-check dsh-gongwen-word-check dsh-grant-cn dsh-guard-plan-qc \
            dsh-hazchem-check dsh-hazplan-check dsh-hidden-risk-map dsh-hs-candidate dsh-hs-classify \
            dsh-icd-rule-check dsh-ifc-qto dsh-image-integrity dsh-import-customs-check \
            dsh-industry-research dsh-invoice-ledger dsh-irb dsh-kit dsh-labor-contract \
            dsh-lawcite-adapter dsh-laya dsh-lc-doc-check dsh-learning-gap-check dsh-legal-clause \
            dsh-legal-intake dsh-library dsh-lit-watch dsh-local-ai dsh-lsp-actions \
            dsh-manuscript-check dsh-mask dsh-mcp-panel dsh-medrec-qc dsh-memento dsh-meta-analysis \
            dsh-notebook-capture dsh-nsfc-form-check dsh-nurse-record-check dsh-observe \
            dsh-origin-rvc-check dsh-ota-review-check dsh-output-styles dsh-paper-doc-adapter \
            dsh-param-repair dsh-payroll-audit dsh-pdf-table dsh-permission-rules \
            dsh-permit-report-check dsh-phocinae dsh-phone-inbox dsh-pim-lint dsh-pipeline-check \
            dsh-pleading-draft dsh-plugin-dev dsh-plugin-devtools dsh-plugin-guide dsh-plugin-portal \
            dsh-plugin-ready dsh-plugin-spec dsh-plugin-start dsh-plugin-tools dsh-plugins \
            dsh-policy-brief-draft dsh-policy-ledger dsh-power-loss-split dsh-power-ticket-check \
            dsh-ppap-check dsh-primer dsh-progress-payment dsh-protest-deadline dsh-provider-params \
            dsh-qms-capa dsh-railway-window dsh-reach dsh-repair-order-qc dsh-repro-audit \
            dsh-research-bench dsh-research-core dsh-research-report dsh-response-letter \
            dsh-retraction-watch dsh-review-reply-check dsh-rfq-compare dsh-rulefile-check \
            dsh-safety-brief-check dsh-safety-ledger-check dsh-scaffold dsh-score dsh-security-pack \
            dsh-session-sync dsh-settlement-docs dsh-sherlock dsh-site-log-check \
            dsh-soe-decision-check dsh-soilwater-check dsh-sop-sync-check dsh-source-cnki \
            dsh-spc-gbt-adapter dsh-sr-ledger dsh-standards dsh-statcheck dsh-store-replenish \
            dsh-table-ingest dsh-talk dsh-tender-extract dsh-tender-matrix dsh-tender-requirements \
            dsh-test-drive dsh-translate dsh-travel-recon dsh-warranty-calc \
            pan17/dsh-wechat jevcore
          )
          sync_repo() {
            local entry="$1"
            local name="${entry##*/}"
            local owner="${entry%%/*}"
            if [ "$owner" = "$entry" ]; then owner="PerryLink"; fi
            rm -rf "/tmp/$name"
            local remote="git@gitee.com:perrylink/$name.git"
            # A mirror repo that does not exist yet on Gitee is skipped, not a
            # failure: once the repo is created on gitee.com, the next run
            # seeds it via the plain-push path below.
            if ! git ls-remote "$remote" HEAD >/dev/null 2>&1; then
              echo "SKIP $name (no mirror repo on gitee)"
              return 0
            fi
            if ! git clone --quiet "https://github.com/$owner/$name.git" "/tmp/$name"; then
              echo "FAIL clone $entry"
              return 1
            fi
            local b tip
            b="$(git -C "/tmp/$name" branch --show-current)"
            tip="$(git ls-remote "$remote" "refs/heads/$b" | awk '{print $1}')"
            if [ -z "$tip" ]; then
              # Mirror branch does not exist yet: plain push seeds it.
              git -C "/tmp/$name" push "$remote" "HEAD:refs/heads/$b" --tags
            else
              # Align the mirror branch to the GitHub tip, then refresh tags
              # (tags may have moved after a release re-tag).
              git -C "/tmp/$name" push --force-with-lease="refs/heads/$b:$tip" "$remote" "HEAD:refs/heads/$b" \
                && git -C "/tmp/$name" push "$remote" --tags --force
            fi
          }
          fails=0
          for r in "${repos[@]}"; do
            if sync_repo "$r"; then
              echo "OK $r"
            else
              echo "FAIL $r"
              fails=$((fails + 1))
            fi
          done
          if [ "$fails" -gt 0 ]; then
            echo "MIRROR SYNC FAILURES: $fails of ${#repos[@]}"
            exit 1
          fi
          echo "all ${#repos[@]} mirrors handled"
